name: YT formats diagnostic
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Probe watch HTML structure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF' > body.txt 2>&1 || true
          import re, urllib.request
          url = "${{ inputs.video_url }}"
          req = urllib.request.Request(url, headers={
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
            "Accept-Language": "en-US,en;q=0.9"})
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", errors="replace")
          print("video:", url)
          print("html bytes:", len(html))
          for pat in ["ytInitialPlayerResponse", "streamingData", "qualityLabel", "playerResponse",
                      "confirm you.re not a bot", "signin", "consent", "og:title", "lengthSeconds"]:
              print(f"{pat!r}: {html.count(pat)}")
          m = re.search(r'<meta property="og:title" content="([^"]+)"', html)
          print("og:title:", m.group(1) if m else None)
          m2 = re.search(r'"lengthSeconds":"(\d+)"', html)
          print("lengthSeconds:", m2.group(1) if m2 else None)
          # any itag-ish format hints
          quals = sorted(set(re.findall(r'"qualityLabel":"([^"]+)"', html)))
          print("qualityLabels:", quals[:20])
          PYEOF
          cat body.txt
          gh issue create --repo NeilFoxAgency/nfa-client-search --title "yt-html-probe ${{ github.run_id }}" --body-file body.txt
