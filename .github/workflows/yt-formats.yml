name: YT formats diagnostic
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Scrape player response from watch HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF' > body.txt 2>&1 || true
          import re, json, urllib.request
          url = "${{ inputs.video_url }}"
          req = urllib.request.Request(url, headers={
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
            "Accept-Language": "en-US,en;q=0.9"})
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", errors="replace")
          print("video:", url)
          print("html bytes:", len(html))
          m = re.search(r"ytInitialPlayerResponse\s*=\s*(\{.+?\});", html, re.S)
          if not m:
              print("NO ytInitialPlayerResponse found")
              raise SystemExit
          pr = json.loads(m.group(1))
          sd = pr.get("streamingData", {})
          fmts = sd.get("formats", []) + sd.get("adaptiveFormats", [])
          print("total formats:", len(fmts))
          seen = set()
          for f in fmts:
              h = f.get("height"); w = f.get("width")
              q = f.get("qualityLabel", f.get("quality", "?"))
              key = (w, h, q)
              if key not in seen:
                  seen.add(key)
                  print(f"{w}x{h} {q} hasAudio={f.get('audioQuality') is not None or 'audio' in str(f.get('mimeType'))} url={'yes' if f.get('url') else 'no'}")
          vd = pr.get("videoDetails", {})
          print("title:", vd.get("title"))
          print("lengthSeconds:", vd.get("lengthSeconds"))
          print("isLiveContent:", vd.get("isLiveContent"))
          PYEOF
          cat body.txt
          gh issue create --repo NeilFoxAgency/nfa-client-search --title "yt-html-formats ${{ github.run_id }}" --body-file body.txt
