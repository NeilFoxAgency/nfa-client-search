name: YT formats diagnostic
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID"
        required: true
        type: string
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Probe alternate sources for HD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF' > body.txt 2>&1 || true
          import json, urllib.request
          vid = "${{ inputs.video_id }}"
          print("video:", vid)
          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"})
              return urllib.request.urlopen(req, timeout=timeout).read()
          # 1. piped API instances
          for inst in ["https://pipedapi.kavin.rocks", "https://pipedapi.adminforge.de",
                       "https://pipedapi.leptons.xyz", "https://pipedapi.reallyaweso.me"]:
              try:
                  raw = get(f"{inst}/streams/{vid}")
                  d = json.loads(raw)
                  streams = d.get("videoStreams", [])
                  hs = sorted(set(s.get("height", 0) for s in streams if s.get("height")))
                  print(f"piped {inst}: OK max_height={max(hs) if hs else None} heights={hs[:12]}")
                  break
              except Exception as e:
                  print(f"piped {inst}: FAIL {str(e)[:80]}")
          # 2. invidious instances
          for inst in ["https://inv.nadeko.net", "https://invidious.nerdvpn.de",
                       "https://iv.melmac.space", "https://inv.tux.pizza"]:
              try:
                  raw = get(f"{inst}/api/v1/videos/{vid}?fields=formatStreams,title,lengthSeconds")
                  d = json.loads(raw)
                  fs = d.get("formatStreams", [])
                  hs = sorted(set(int(s.get("height", 0)) for s in fs if s.get("height")))
                  print(f"invidious {inst}: OK max_height={max(hs) if hs else None} heights={hs[:12]}")
                  break
              except Exception as e:
                  print(f"invidious {inst}: FAIL {str(e)[:80]}")
          # 3. oembed (sanity that video exists)
          try:
              raw = get(f"https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v={vid}&format=json")
              print("oembed:", json.loads(raw).get("title"))
          except Exception as e:
              print("oembed FAIL", str(e)[:80])
          PYEOF
          cat body.txt
          gh issue create --repo NeilFoxAgency/nfa-client-search --title "yt-alt-probe ${{ github.run_id }}" --body-file body.txt
