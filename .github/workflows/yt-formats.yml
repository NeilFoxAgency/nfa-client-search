name: YT formats diagnostic
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL"
        required: true
        type: string
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Dump formats and report via issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q -U yt-dlp
          yt-dlp -F "${{ inputs.video_url }}" > formats.txt 2>&1 || true
          { echo "video: ${{ inputs.video_url }}"; echo; cat formats.txt; } > body.txt
          gh issue create --repo NeilFoxAgency/nfa-client-search --title "yt-formats ${{ github.run_id }}" --body-file body.txt
