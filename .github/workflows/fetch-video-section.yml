name: Fetch video section (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Full video URL to download from"
        required: true
        type: string
      section:
        description: 'yt-dlp --download-sections value, e.g. *00:42:30-00:43:30'
        required: true
        type: string
      out_name:
        description: "Base name for the output file (no extension)"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install yt-dlp (latest)
        run: pip install -q -U yt-dlp && yt-dlp --version

      - name: Write YouTube cookies (if configured)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > yt_cookies.txt
            echo "YouTube cookies configured"
          else
            echo "No YouTube cookies configured; proceeding without"
          fi

      - name: Dump available formats (diagnostic)
        run: |
          COOKIE_ARG=""
          [ -f yt_cookies.txt ] && COOKIE_ARG="--cookies yt_cookies.txt"
          # shellcheck disable=SC2086
          yt-dlp $COOKIE_ARG -F "${{ inputs.video_url }}" > formats.txt 2>&1 || true
          cat formats.txt

      - name: Download section
        run: |
          COOKIE_ARG=""
          [ -f yt_cookies.txt ] && COOKIE_ARG="--cookies yt_cookies.txt"
          # shellcheck disable=SC2086
          yt-dlp --verbose $COOKIE_ARG -f "bv*[height<=1080]+ba/b[height<=1080]/b" \
            --download-sections "${{ inputs.section }}" \
            -o "${{ inputs.out_name }}.%(ext)s" \
            "${{ inputs.video_url }}" 2>&1 | tail -30
          ls -la "${{ inputs.out_name }}."*

      - name: Probe resolution
        run: |
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,codec_name,duration \
            -of default=noprint_wrappers=1 "${{ inputs.out_name }}."* | head -5 || true

      - name: Remove cookies file (never upload the secret)
        if: always()
        run: rm -f yt_cookies.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-section-${{ inputs.out_name }}
          path: |
            ${{ inputs.out_name }}.*
            formats.txt
          retention-days: 7
          if-no-files-found: error
